name: keiyo_chat_app
description: Keiyo 智能客服管理端 APP（会话中心 + 统计）
publish_to: 'none'
version: 1.0.7+8

environment:
  # flutter_foreground_task 11.x 要求 Flutter >= 3.44、Dart >= 3.12（本地与 CI 均为 Flutter 3.47.3）
  sdk: '>=3.12.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # Material / Cupertino 自带组件文案的多语言支持（列表选择、文本菜单等）
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.7.0
  provider: ^6.1.2
  shared_preferences: ^2.3.3
  socket_io_client: ^3.0.2
  # 0.7.7 起提供 sizedImageBuilder：消息气泡里的图片需要它做尺寸控制与点击预览
  flutter_markdown: ^0.7.7
  fl_chart: ^0.69.2
  # flutter_localizations 依赖 intl ^0.20.3，保持一致
  intl: ^0.20.3
  # 20 起 initialize/show/cancel 改具名参数；22.1.0 起提供 Package.swift（SPM）。
  # 不取 23.x：23 把插件自身 compileSdk 抬到 37 + AGP 9.1.1，而 Flutter 3.47 的
  # flutter.compileSdkVersion 仍是 36，升级后 app 依赖检查直接构建失败。
  flutter_local_notifications: ^22.3.3
  # 11.0.0 起支持 SPM（iOS 侧用 module import，不再需要桥接头文件）
  flutter_foreground_task: ^11.0.3
  permission_handler: ^11.4.0
  # 表单数据 link 类型：点击用系统浏览器打开
  url_launcher: ^6.3.0
  # 客服回复图片：从相册选图后上传到 /admin/upload/image
  image_picker: ^1.1.2
  # 推送（L3）：Android 走 Google FCM，iOS 由 FCM 转发 APNs
  # Firebase Android BoM 33 要求 minSdk 23 / compileSdk 34，iOS 13+
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  # 新消息提示音：前台播放 assets/new_message.mp3（后台由系统通知发声）
  audioplayers: ^6.8.1
  # 登录页展示版本号：与 pubspec 的 version 保持一致，方便排查用户安装的版本
  package_info_plus: ^8.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  # 与 Web 管理端共用同一张品牌标（keiyo-chat-admin/src/assets/support-logo.png）
  assets:
    - assets/support-logo.png
    # 新消息提示音：菜单里的“提示音”开关开启时在前台播放
    - assets/new_message.mp3
