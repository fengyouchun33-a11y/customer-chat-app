name: build release artifacts

# 手动触发，或推一个 v 开头的 tag（打 tag 即出包）。
# AAB 与 IPA 是两个独立 job：Android 跑在 ubuntu 上，iOS 只能在 macOS 上跑，
# 二者互不阻塞，任一签名材料有问题时另一个仍能出包。
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          # 与本地开发机同版本（Flutter 3.47.3 / Dart 3.13.3），避免 CI 与本地表现不一致
          flutter-version: "3.47.3"
          channel: stable
          cache: true

      # keystore 与 key.properties 都不进仓库，CI 里从 Secrets 还原。
      # build.gradle.kts 读的是 rootProject.file("key.properties")，即 android/key.properties。
      - name: restore android signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ANDROID_KEYSTORE_BASE64 is empty, add it in Settings > Secrets" >&2
            exit 1
          fi
          mkdir -p android/keystore
          echo "$KEYSTORE_BASE64" | tr -d '\r' | base64 -d > android/keystore/com.reflex.customer.service.keystore
          {
            echo "storePassword=$STORE_PASSWORD"
            echo "keyPassword=$KEY_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "storeFile=keystore/com.reflex.customer.service.keystore"
          } > android/key.properties
          echo "keystore bytes: $(wc -c < android/keystore/com.reflex.customer.service.keystore)"

      - name: build appbundle
        run: flutter build appbundle --release

      - uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error

  ios:
    # iOS 归档只能在有 Xcode 的 macOS 机器上做，这就是本地打不了 ipa 的原因。
    # 用 macos-15 而不是 macos-14：macOS 14 镜像已于 2026-11-02 退役，
    # 继续用 macos-14 会被判为不支持的配置，job 分配不到 runner 就秒取消。
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.3"
          channel: stable
          cache: true

      # 三步：还原 p12 与描述文件 → 建临时钥匙串并导入证书 → 授权 codesign 读取私钥。
      # 缺 partition-list 这一步时，codesign 会报 errSecInternalComponent。
      - name: restore ios signing
        env:
          P12_BASE64: ${{ secrets.IOS_CERT_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_CERT_P12_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.IOS_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "$P12_BASE64" ] || [ -z "$PROFILE_BASE64" ]; then
            echo "IOS_CERT_P12_BASE64 / IOS_PROFILE_BASE64 missing" >&2
            exit 1
          fi

          mkdir -p .ci-tmp
          echo "$P12_BASE64" | tr -d '\r' | base64 -d > .ci-tmp/dist.p12
          echo "$PROFILE_BASE64" | tr -d '\r' | base64 -d > .ci-tmp/dist.mobileprovision

          # 描述文件按 UUID 命名，两个路径分别对应 Xcode 15 与 Xcode 16 的存放位置
          UUID=$(security cms -D -i .ci-tmp/dist.mobileprovision \
            | plutil -extract UUID raw -o - -)
          echo "profile UUID: $UUID"
          install -d "$HOME/Library/MobileDevice/Provisioning Profiles"
          install -d "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"
          cp .ci-tmp/dist.mobileprovision "$HOME/Library/MobileDevice/Provisioning Profiles/$UUID.mobileprovision"
          cp .ci-tmp/dist.mobileprovision "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles/$UUID.mobileprovision"

          KEYCHAIN=.ci-tmp/build.keychain
          security create-keychain -p "$P12_PASSWORD" "$KEYCHAIN"
          security default-keychain -s "$KEYCHAIN"
          security unlock-keychain -p "$P12_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -t 3000 -u "$KEYCHAIN"
          security import .ci-tmp/dist.p12 -k "$KEYCHAIN" -P "$P12_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$P12_PASSWORD" "$KEYCHAIN"
          security find-identity -v -p codesigning "$KEYCHAIN"

      - name: build ipa
        run: |
          set -euo pipefail
          pod repo update --silent || true
          flutter build ipa --release --export-options-plist=ios/ExportOptions.plist

      - uses: actions/upload-artifact@v4
        with:
          name: app-release-ipa
          path: build/ios/ipa/*.ipa
          if-no-files-found: error
